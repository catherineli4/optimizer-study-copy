# JOLMo SAM Training Configuration Example
# For Sharpness-Aware Minimization experiments

# Model configuration using factory method
model_factory: llama2_271M
model_factory_args:
  vocab_size: 50304  # GPT-2 tokenizer padded vocab size

# Training module type: "sam" for SAM training
train_module_type: sam

# Training module configuration (base optimizer settings)
train_module:
  rank_microbatch_size: 32768  # tokens per GPU
  max_sequence_length: 2048
  
  # Base optimizer configuration (AdamW for SAM)
  optim:
    lr: 0.003  # 3e-3
    betas: [0.9, 0.95]
    weight_decay: 0.1
    group_overrides:
      - params: ["embeddings.weight"]
        opts:
          weight_decay: 0.0
  
  # Learning rate scheduler
  scheduler:
    warmup_steps: 1000
    alpha_f: 0.1
  
  # Distributed training config
  dp_config:
    name: fsdp
    param_dtype: bfloat16
    reduce_dtype: float32
  
  # Gradient clipping
  max_grad_norm: 1.0
  
  # Enable torch.compile
  compile_model: true

# SAM-specific configuration
sam:
  rho: 0.05  # SAM perturbation radius
  adaptive: false  # Use adaptive SAM or not

# Optional: SAM scheduler (schedule rho over training)
sam_scheduler:
  warmup_steps: 1000
  # Can add decay schedule here if needed

# Dataset configuration
dataset:
  paths:
    - /path/to/your/train_data.npy  # Update this path
  sequence_length: 2048
  tokenizer:
    identifier: gpt2
  work_dir: /tmp/dataset-cache

# Data loader configuration
data_loader:
  global_batch_size: 524288  # 512K tokens total
  seed: 0
  num_workers: 4

# Trainer configuration
trainer:
  save_folder: /path/to/checkpoints/sam  # Update this path
  save_overwrite: false
  
  # Checkpointing
  save_interval: 1000
  ephemeral_save_interval: 100
  
  # Monitoring
  metrics_collect_interval: 10
  cancel_check_interval: 10

# WandB configuration
wandb:
  enabled: false  # Set to true to enable
  name: jolmo_sam_experiment
  project: optimizer-study
  entity: your-entity
  group: jolmo_sam
  tags: ["jolmo", "sam", "catastrophic_forgetting"]

# Validation datasets
validation_datasets:
  c4_validation:
    - /path/to/validation_data.npy  # Update this path
validation_eval_interval: 250

# Training settings
init_seed: 12536
n_tokens: 100000000  # Train for 100M tokens

# Optional: Load from checkpoint
load_path: null
load_optim_state: false
load_trainer_state: false
load_data_loader_state: true
