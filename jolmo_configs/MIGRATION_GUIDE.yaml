# Migration Guide: Old OLMo Config → JOLMo Config
# This shows how config fields map between the two systems

# ============================================================================
# OLD OLMO CONFIG (configs/custom_dataset_example.yaml)
# ============================================================================
# run_name: OLMo-7B
# seed: 6198
# 
# model:
#   d_model: 4096
#   n_heads: 32
#   n_layers: 32
#   mlp_hidden_size: 16384
#   rope: true
#   flash_attention: false
#   max_sequence_length: 2048
#   vocab_size: 32100
#   init_device: cuda
#   init_fn: mitchell
# 
# optimizer:
#   name: adamw
#   learning_rate: 3.0e-4
#   weight_decay: 0.1
#   betas: [0.9, 0.95]
# 
# scheduler:
#   name: cosine_with_warmup
#   t_warmup: 1000
#   alpha_f: 0.1
# 
# tokenizer:
#   identifier: t5-base
# 
# save_folder: ${oc.env:CHECKPOINTS_PATH}
# save_interval: 100
# 
# max_duration: 515
# global_train_batch_size: 128
# device_train_microbatch_size: 32
# 
# distributed_strategy: fsdp
# fsdp:
#   wrapping_strategy: by_block
#   precision: mixed
#   sharding_strategy: FULL_SHARD

# ============================================================================
# NEW JOLMO CONFIG (Equivalent)
# ============================================================================

# ===== Model Configuration =====
# OLD: model.d_model, model.n_heads, etc.
# NEW: Use full model config or factory

model:
  d_model: 4096
  n_layers: 32
  block:
    attention:
      n_heads: 32
      rope: true
      bias: false
    feed_forward:
      hidden_size: 16384  # OLD: mlp_hidden_size
      activation: swiglu
      bias: false
    layer_norm:
      eps: 1e-5
      bias: false
  lm_head:
    tie_weights: false
  vocab_size: 32100
  dtype: bfloat16

# Or use factory:
# model_factory: llama_7B
# model_factory_args:
#   vocab_size: 32100

# ===== Training Module =====
# OLD: optimizer, scheduler sections
# NEW: Combined in train_module

train_module_type: normal

train_module:
  # OLD: device_train_microbatch_size (in instances)
  # NEW: rank_microbatch_size (in tokens)
  # Conversion: device_train_microbatch_size * max_sequence_length
  rank_microbatch_size: 65536  # 32 * 2048
  
  max_sequence_length: 2048
  
  # OLD: optimizer section
  # NEW: optim section
  optim:
    lr: 0.0003  # OLD: learning_rate
    betas: [0.9, 0.95]
    weight_decay: 0.1
    # Embedding weight decay override
    group_overrides:
      - params: ["embeddings.weight"]
        opts:
          weight_decay: 0.0
  
  # OLD: scheduler section
  # NEW: scheduler section (similar)
  scheduler:
    warmup_steps: 1000  # OLD: t_warmup
    alpha_f: 0.1
  
  # OLD: distributed_strategy + fsdp sections
  # NEW: dp_config
  dp_config:
    name: fsdp  # OLD: distributed_strategy: fsdp
    param_dtype: bfloat16  # OLD: fsdp.precision: mixed
    reduce_dtype: float32
    # OLD: fsdp.sharding_strategy: FULL_SHARD (default in JOLMo)
  
  # Gradient clipping (same)
  max_grad_norm: 1.0
  
  # Enable torch.compile (optional)
  compile_model: true

# ===== Dataset Configuration =====
# OLD: Inferred from data loading
# NEW: Explicit dataset config

dataset:
  paths:
    - /path/to/your/data.npy  # Must be .npy format!
  sequence_length: 2048  # OLD: max_sequence_length
  tokenizer:
    identifier: t5-base  # Same as OLD
  work_dir: /tmp/dataset-cache

# ===== Data Loader Configuration =====
# OLD: global_train_batch_size (in instances)
# NEW: global_batch_size (in tokens!)

data_loader:
  # OLD: global_train_batch_size * max_sequence_length
  # 128 * 2048 = 262144 tokens
  global_batch_size: 262144  # IMPORTANT: In tokens, not instances!
  seed: 6198  # OLD: seed
  num_workers: 4

# ===== Trainer Configuration =====
# OLD: save_folder, save_interval, max_duration
# NEW: trainer section

trainer:
  save_folder: /path/to/checkpoints  # OLD: save_folder
  save_overwrite: false
  
  # OLD: save_interval (in steps)
  # NEW: save_interval (in steps)
  save_interval: 100
  
  # Optional: ephemeral checkpoints for quick recovery
  ephemeral_save_interval: 50
  
  # Monitoring
  metrics_collect_interval: 10
  cancel_check_interval: 10

# ===== Training Duration =====
# OLD: max_duration (in steps)
# NEW: n_tokens (in tokens) - more intuitive!

# OLD calculation: max_duration * global_train_batch_size * max_sequence_length
# 515 steps * 128 instances * 2048 tokens = 135M tokens
n_tokens: 135000000  # 135M tokens

# Or use steps in trainer:
# trainer:
#   max_duration: 515

# ===== WandB Configuration =====
# OLD: wandb section (similar)
# NEW: wandb section (similar)

wandb:
  enabled: false  # Set to true to enable
  name: OLMo-7B  # OLD: run_name
  project: optimizer-study
  entity: your-entity
  group: olmo-experiments

# ===== Validation (Optional in JOLMo) =====
validation_datasets:
  validation: [/path/to/validation.npy]
validation_eval_interval: 100

# ===== Other Settings =====
init_seed: 6198  # OLD: seed

# Optional: Load from checkpoint
load_path: null
load_optim_state: false
load_trainer_state: false
load_data_loader_state: true

# ============================================================================
# KEY DIFFERENCES SUMMARY
# ============================================================================
#
# 1. BATCH SIZES
#    OLD: Specified in instances (sequences)
#    NEW: Specified in TOKENS
#    Conversion: instances * sequence_length
#
# 2. DATA FORMAT
#    OLD: Various formats supported
#    NEW: Must use .npy files with tokenized data
#
# 3. MODEL SPECIFICATION
#    OLD: Flat model config
#    NEW: Nested config (block.attention, block.feed_forward, etc.)
#         OR use factory methods
#
# 4. DISTRIBUTED CONFIG
#    OLD: distributed_strategy + fsdp sections
#    NEW: train_module.dp_config
#
# 5. TRAINING DURATION
#    OLD: max_duration in steps
#    NEW: n_tokens (more intuitive) or max_duration in trainer
#
# 6. OPTIMIZER CONFIG
#    OLD: Top-level optimizer section
#    NEW: train_module.optim
#
# 7. CHECKPOINT LOADING
#    OLD: load_path only
#    NEW: load_path + granular control (load_optim_state, etc.)
#
# ============================================================================
